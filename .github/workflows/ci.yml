name: Baseline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install allowed dependencies (CPU PyTorch)
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Committed real model interface contracts
        run: python -m pytest tests/test_interface_conformance.py -q -k "not end_to_end_toy"
      - name: Load and evaluate submitted neural artifacts
        run: python scripts/evaluate_neural.py --features data/toy/vali.txt
      - name: Toy smoke test and full correctness suite with its toy-trained fixture
        run: |
          cp submission/model.txt "$RUNNER_TEMP/committed-model.txt"
          trap 'cp "$RUNNER_TEMP/committed-model.txt" submission/model.txt' EXIT
          bash scripts/smoke_test.sh
          python -m pytest tests -q
      - name: Synthetic transfer dry runs
        run: python scripts/run_recipe.py
